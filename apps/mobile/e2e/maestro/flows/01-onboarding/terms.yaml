appId: com.jrzlabs.orbithub
tags: [smoke]
---
# Los terminos, y la vuelta. La misma forma que la privacidad y por el mismo
# motivo: enlace del aviso, afirmacion al volver, y nada de coordenadas.
- launchApp
# El motivo de `extendedWaitUntil` y de la espera antes del toque esta en
# `privacy.yaml` y en `welcome.yaml`, con las medidas.
- extendedWaitUntil:
    visible:
      id: screen-welcome
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: welcome-terms
- assertVisible:
    id: screen-terms
# La tecla de atras sale de la aplicacion en vez de desapilar; el por que esta
# escrito en `apps/mobile/e2e/README.md`. Es lo unico que deja estos dos flujos
# en rojo.
- back
- assertVisible:
    id: screen-welcome
- takeScreenshot: capturas/android/03-terms