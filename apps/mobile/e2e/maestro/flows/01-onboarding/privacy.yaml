appId: com.jrzlabs.orbithub
tags: [smoke]
---
# La politica de privacidad, y la vuelta.
#
# Se llega por el enlace del aviso legal y no por una deep link: el enlace es lo
# que hay que probar, porque una deep link se abriria aunque el enlace estuviese
# roto. Y el enlace se toca por su `id`, que es como Maestro ve un `testID`: una
# cadena suelta seria un selector de texto y el texto de los dos enlaces sale del
# diccionario. La razon de que un `testID` dentro de otro `Text` no valiera esta en
# `legal-notice.tsx`.
- launchApp
# Tras el arranque, `extendedWaitUntil`: el motivo y la medida estan en
# `welcome.yaml`. Y el tope es el mismo por una razon que solo se ve aqui: este flujo
# espera una pantalla caliente -el `back` del flujo anterior la deja en pie-, pero con
# `continueOnFailure: true` corre **igual** cuando el anterior fallo, y entonces
# hereda su arranque en frio con la descarga de los 13 MB del bundle. Con el tope
# pequeno de antes, un fallo de `welcome` se convertia en dos fallos en vez de uno, y
# el informe senalaba dos problemas donde solo habia uno.
- extendedWaitUntil:
    visible:
      id: screen-welcome
    timeout: 180000
# Y una espera antes del toque: Maestro **reintenta las afirmaciones y no los
# toques**. Los dos enlaces estan al final de la pantalla -y 2250 de 2400- y en un
# build de depuracion se cruzan con el aviso de LogBox, que sale por abajo del todo.
# Con el marcador presente y en su sitio, y el toque dando en el centro exacto de sus
# limites, la navegacion no ocurria: measured, dos veces.
- waitForAnimationToEnd
- tapOn:
    id: welcome-privacy
- assertVisible:
    id: screen-privacy
# Volver es parte del flujo, no limpieza: un flujo que se queda con una hoja
# abierta deja al siguiente mirando donde no toca, y ese fallo se lee como un fallo
# del siguiente.
#
# Y volver con la **tecla de atras de hardware**, no con el boton de la cabecera:
# es lo que fallaba y es lo que se comprueba. Medido: con
# `android.predictiveBackGestureEnabled` en `true` la tecla cerraba la aplicacion en
# vez de desapilar, porque React Native solo registra su `OnBackPressedCallback`
# cuando `SDK_INT >= 36 && targetSdkVersion >= 36`, y el emulador es API 35. El
# motivo y el precio del arreglo estan en el ADR 0034.
- back
- assertVisible:
    id: screen-welcome
- takeScreenshot: capturas/android/02-privacy