appId: com.jrzlabs.orbithub
tags: [smoke]
---
# El arranque sin sesion, con los datos limpiados.
#
# `clearState` y no un simple `launchApp` porque esta suite no empieza por la
# sesion sino por la falta de ella: sin esto el emulador que somebody dejo con una
# sesion abierta devuelve el panel, y el flujo se pasa probando el panel.
- launchApp:
    clearState: true
# Y `extendedWaitUntil` y no `assertVisible` para lo que viene justo despues: tras
# un `clearState` hay un arranque en frio, y la ventana de reintento de
# `assertVisible` se agota antes. Measured en este emulador: `screen-welcome` aparece
# a los **26.3 s** con el bundle de Metro recien servido y a los **3.7 s** con el
# bundle ya caliente, y la afirmacion normal daba error a los 17.5 s con la app
# abierta y la pantalla en negro. Un 60 s deja margen de sobra para el peor caso
# medido, y sigue siendo un tope.
#
# Esto y el `{ id: ... }` de abajo son las dos formas de que este flujo no sea uno
# que depende del dia: un selector que no es un selector, y una espera que no
# llega.
- extendedWaitUntil:
    visible:
      id: screen-welcome
    timeout: 60000
- takeScreenshot: capturas/android/01-welcome