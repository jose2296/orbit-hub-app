# OrbitHub web on nginx.
#
# The export is flat: 21 `.html` files at the root and no folders. That is the
# shape `output: "static"` produces, and it is why this file exists at all.

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Railway terminates TLS in front of this, so the scheme nginx sees is http.
  # Without this the app takes the http branch of `share/a link`, and a link that
  # a phone opens on https is a link a phone will refuse to open.
  absolute_redirect off;

  # Expo Router writes the JS bundle with hashed names under `_expo/static`, and
  # their content never changes for a given name. The HTML documents must not be
  # cached that way: a new deploy changes what `/workspaces` does, and a browser
  # holding the old document would keep asking the server for a bundle that is
  # still there but no longer the one the page expects.
  location /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /service-worker.js {
    # Not built yet (Phase 7). `+html.tsx` asks for it in production builds, so
    # answering 404 here is what the browser already expects; answering 200 with
    # an empty file would be worse, because that is a service worker which
    # installs and caches nothing.
    add_header Cache-Control "no-store";
    return 404;
  }

  location / {
    add_header Cache-Control "no-cache";
    # Three things, in order:
    #   1. the file itself, for /workspaces.html and the assets;
    #   2. `$uri.html`, for /workspaces — the route without the extension that
    #      Expo wrote it with. This is the rule the flat export depends on and
    #      the reason a direct link to a screen works instead of 404ing;
    #   3. /index.html, so a client-side route that has no static page (a note
    #      id, a folder id) still boots the app and lets the router draw it.
    try_files $uri $uri.html $uri/index.html /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}