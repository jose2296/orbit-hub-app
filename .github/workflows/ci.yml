name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Test (API)
        run: npm run test --workspace @orbit-hub/api

      - name: Validate Expo config
        run: npm run config:check --workspace @orbit-hub/mobile

      - name: Expo doctor
        run: npx --yes expo-doctor@latest apps/mobile

      - name: Build the API bundle
        run: npm run api:build

  web:
    name: Web export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build:packages

      - name: Static export (web target)
        run: npm run export:web

      - uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: apps/mobile/dist
          retention-days: 7
